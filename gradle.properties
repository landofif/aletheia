# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.17

# Mod Properties
mod_version=1.0.0
maven_group=dev.landofif
archives_base_name=aletheia

# Where `./gradlew build` drops the finished jar, so the instance is always running the latest build.
# Left blank here because the path is machine-specific: set it in ~/.gradle/gradle.properties,
# or override per-run with -Pmods_dir=/other/path. Blank means the install step is skipped.
mods_dir=

# Dependencies
fabric_api_version=0.155.2+26.1.2
junit_version=6.1.2

# YetAnotherConfigLib -- https://modrinth.com/mod/yacl
# The version carries the Minecraft branch and loader it was built for, so it moves with the game version.
yacl_version=3.9.6+26.1-fabric

# Mod Menu, for the settings entry on the mod list. Compile only -- the mod runs without it.
modmenu_version=18.0.0
